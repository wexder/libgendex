name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node .github/scripts/prepare-release.mjs

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - id: release
        run: node .github/scripts/prepare-release.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the native image by digest
        id: container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=libgendex-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=libgendex-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Export image digest
        env:
          DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          test "${#DIGEST}" = 71
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate tag and prepare chart with the release image repository
        id: release
        run: node .github/scripts/prepare-release.mjs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Package chart before publishing
        env:
          CHART_DIR: ${{ steps.release.outputs.chart_dir }}
        run: |
          helm lint "$CHART_DIR" --strict
          helm package "$CHART_DIR" --destination dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish the multi-platform container tags
        id: container
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" = 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json"
          digest=$(node -e '
            const manifest = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const platforms = new Set((manifest.manifests || []).map(m => `${m.platform?.os}/${m.platform?.architecture}`));
            for (const platform of ["linux/amd64", "linux/arm64"]) {
              if (!platforms.has(platform)) throw new Error(`Published image is missing ${platform}`);
            }
            console.log(manifest.digest);
          ' "$RUNNER_TEMP/manifest.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Publish Helm chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          CHART_REGISTRY: ${{ steps.release.outputs.chart_registry }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_USER" --password-stdin
          helm push "dist/libgendex-$RELEASE_VERSION.tgz" "$CHART_REGISTRY"
          helm pull "$CHART_REGISTRY/libgendex" --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP"
          cmp "dist/libgendex-$RELEASE_VERSION.tgz" "$RUNNER_TEMP/libgendex-$RELEASE_VERSION.tgz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          CHART_REGISTRY: ${{ steps.release.outputs.chart_registry }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          cat > "$RUNNER_TEMP/release.md" <<EOF
          Container: \`$IMAGE:$RELEASE_VERSION\`
          Container digest: \`$IMAGE_DIGEST\`
          Helm chart: \`$CHART_REGISTRY/libgendex\` (version \`$RELEASE_VERSION\`)

          Published images support linux/amd64 and linux/arm64.
          EOF
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release.md")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "dist/libgendex-$RELEASE_VERSION.tgz" "${args[@]}"
