[package]
name = "myisam-reader"
version = "0.1.0"
edition = "2024"
description = "Streaming reader for legacy MySQL 5.x FRM and fixed/dynamic MyISAM tables"
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[[bench]]
name = "real_data"
harness = false
